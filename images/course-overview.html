<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf8f1;
      --color-ink:     #1c1c1c;
      --color-muted:   #555555;
      --font-sans:     'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }
    .frame { max-width: 960px; width: 100%; }
    h1 {
      font-size: clamp(1.75rem, 2.4vw + 0.8rem, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .subtitle { font-size: 1rem; color: var(--color-muted); margin-bottom: 2rem; }
    .figure { overflow-x: auto; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Introduction to Probability</h1>
    <p class="subtitle">Part A: chance and counting · Part B: updating with information · Part C: random variables · final quiz · certificate</p>

    <div class="figure">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prob-course-overview-title prob-course-overview-desc"
         font-family="Inter, system-ui, sans-serif">
      <title id="prob-course-overview-title">Introduction to Probability: course path</title>
      <desc id="prob-course-overview-desc">Part A covers four lessons on chance and counting, Part B two lessons on conditional probability and Bayes' theorem, Part C three lessons on random variables, then a final quiz where 8 of 10 correct earns a certificate you can download and share.</desc>
      <defs>
        <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#444444"/></marker>
        <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#2e7d32"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf8f1"/>

      <!-- Zones -->
      <rect x="40" y="32" width="880" height="124" rx="16" fill="#ebf0f4" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="56" y="60" font-size="16" font-weight="700" fill="#245c99">Part A · Chance and counting</text>
      <rect x="40" y="196" width="364" height="140" rx="16" fill="#f3edf2" stroke="#7b4a8f" stroke-width="1.5"/>
      <text x="56" y="224" font-size="16" font-weight="700" fill="#7b4a8f">Part B · Updating with information</text>
      <rect x="444" y="196" width="476" height="140" rx="16" fill="#eef3ec" stroke="#3f7d4f" stroke-width="1.5"/>
      <text x="460" y="224" font-size="16" font-weight="700" fill="#2f6a3f">Part C · Random variables</text>

      <!-- Connectors -->
      <line x1="222" y1="156" x2="222" y2="196" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="404" y1="276" x2="444" y2="276" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <polyline points="682,336 682,384 180,384 180,440" fill="none" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="300" y1="480" x2="500" y2="480" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Connector label -->
      <rect x="342" y="452" width="116" height="20" fill="#faf8f1"/>
      <text x="400" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#276b2b">8 of 10 to pass</text>

      <!-- Part A lessons -->
      <rect x="60" y="76" width="196" height="60" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="158" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Why probability?</text>
      <rect x="276" y="76" width="196" height="60" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="374" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Sets &amp; sample spaces</text>
      <rect x="492" y="76" width="196" height="60" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="590" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Counting</text>
      <rect x="708" y="76" width="196" height="60" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.5"/>
      <text x="806" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Basic rules</text>

      <!-- Part B lessons -->
      <rect x="60" y="244" width="156" height="72" rx="12" fill="#ffffff" stroke="#7b4a8f" stroke-width="1.5"/>
      <text x="138" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Conditional</text>
      <text x="138" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">probability</text>
      <rect x="228" y="244" width="156" height="72" rx="12" fill="#ffffff" stroke="#7b4a8f" stroke-width="1.5"/>
      <text x="306" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Bayes' theorem</text>

      <!-- Part C lessons -->
      <rect x="464" y="244" width="140" height="72" rx="12" fill="#ffffff" stroke="#3f7d4f" stroke-width="1.5"/>
      <text x="534" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Random</text>
      <text x="534" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">variables</text>
      <rect x="616" y="244" width="140" height="72" rx="12" fill="#ffffff" stroke="#3f7d4f" stroke-width="1.5"/>
      <text x="686" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Common</text>
      <text x="686" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">distributions</text>
      <rect x="768" y="244" width="136" height="72" rx="12" fill="#ffffff" stroke="#3f7d4f" stroke-width="1.5"/>
      <text x="836" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Two</text>
      <text x="836" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">variables</text>

      <!-- Final quiz -->
      <rect x="60" y="440" width="240" height="80" rx="12" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
      <text x="180" y="486" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Final quiz</text>

      <!-- Focal: the certificate (larger, double frame like the real one) -->
      <rect x="500" y="416" width="380" height="128" rx="12" fill="#dff0e0" stroke="#2e7d32" stroke-width="3"/>
      <rect x="508" y="424" width="364" height="112" rx="8" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
      <text x="690" y="472" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1c">Your certificate</text>
      <text x="690" y="504" text-anchor="middle" font-size="16" fill="#555555">Download and share</text>
    </svg>
    </div>
  </div>
</body>
</html>
